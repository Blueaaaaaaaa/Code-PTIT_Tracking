# Model Configuration
knowledge_tracer:
  hidden_dim: 256
  num_layers: 2
  dropout: 0.2
  learning_rate: 0.001

exercise_analyzer:
  model_name: 'bert-base-uncased'
  max_length: 512
  batch_size: 32

path_optimizer:
  learning_rate: 0.0003
  gamma: 0.99
  buffer_size: 10000
  batch_size: 64

# Data Configuration
data:
  raw_path: 'data/raw'
  processed_path: 'data/processed'
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

# Training Configuration
training:
  epochs: 100
  batch_size: 32
  early_stopping_patience: 5
  checkpoint_dir: 'models'

# Web Interface Configuration
interface:
  theme: 'light'
  port: 8501
  host: 'localhost'
